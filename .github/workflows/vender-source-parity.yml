name: Vender Odoo full-source parity smoke (isolated)

on:
  push:
    branches:
      - vender/architecture
    paths:
      - .github/workflows/vender-source-parity.yml
      - ci/Dockerfile.source-parity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vender-source-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: vender_smoke_only
          POSTGRES_DB: vender_source_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d vender_source_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout public test harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout complete original Odoo 20 source at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: AmgadSenan/vender-odoo-base
          ref: 49529f034a60e4e9838e08e0a5616e5f2f38c601
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and complete source layout
        shell: bash
        run: |
          set -euo pipefail
          expected=49529f034a60e4e9838e08e0a5616e5f2f38c601
          test "$(git -C source rev-parse HEAD)" = "$expected"
          for path in odoo-bin odoo/cli/__init__.py odoo/addons/base/__manifest__.py addons/web/__manifest__.py LICENSE requirements.txt; do
            test -f "source/$path"
          done
          echo "Pinned upstream source: $expected"
          echo "Source addon manifests: $(find source/odoo/addons source/addons -name __manifest__.py -type f | wc -l)"

      - name: Assert source commit matches official Odoo package metadata
        shell: bash
        run: |
          docker run --rm --network none --entrypoint python3 \
            odoo:20.0-20261015@sha256:3de556969ca7916fe7d1a7fa3be2a49307a147c5fa1491bc2c57dcb0b950bea5 \
            -c 'from odoo import release; expected="49529f034a60e4e9838e08e0a5616e5f2f38c601"; actual=release.repos_heads["odoo"]; print("Official Odoo package source:",actual); assert actual==expected'

      - name: Build comparison image from full Odoo Git source
        shell: bash
        run: |
          set -euo pipefail
          docker build --file harness/ci/Dockerfile.source-parity \
            --tag vender/odoo-source-parity:research-49529f034a60 source

      - name: Compare runtime CLI in offline containers
        shell: bash
        run: |
          set -euo pipefail
          echo "Reference Odoo image:"
          docker run --rm --network none --entrypoint odoo \
            odoo:20.0-20261015@sha256:3de556969ca7916fe7d1a7fa3be2a49307a147c5fa1491bc2c57dcb0b950bea5 --version
          echo "Source-built comparison image:"
          docker run --rm --network none --entrypoint odoo \
            vender/odoo-source-parity:research-49529f034a60 --version
          docker run --rm --network none --entrypoint odoo \
            vender/odoo-source-parity:research-49529f034a60 --help > /tmp/odoo-source-help.txt
          test -s /tmp/odoo-source-help.txt

      - name: Verify Python runtime and source addon availability
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python3 \
            vender/odoo-source-parity:research-49529f034a60 \
            -c 'import odoo, odoo.cli, odoo.release, pathlib; p=pathlib.Path("/usr/lib/python3/dist-packages/odoo/addons"); addons=list(p.glob("*/__manifest__.py")); print("odoo_source:",list(odoo.__path__)); print("installed_addon_manifests:",len(addons)); assert len(addons)>500'
          echo "Source parity CLI smoke passed (database integration NOT tested)."

      - name: Initialize Odoo base and web on disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --entrypoint odoo \
            vender/odoo-source-parity:research-49529f034a60 \
            --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=vender_smoke_only \
            --database=vender_source_smoke \
            --init=base,web --without-demo=all --stop-after-init --no-http \
            --log-level=warn
          echo "Disposable PostgreSQL 17 registry initialized successfully."

      - name: Record experimental-only outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Full-source experimental comparison"
            echo "- Upstream source commit: \`49529f034a60e4e9838e08e0a5616e5f2f38c601\` (candidate)."
            echo "- Reference image: \`odoo:20.0-20261015@sha256:3de556969ca7916fe7d1a7fa3be2a49307a147c5fa1491bc2c57dcb0b950bea5\`."
            echo "- This job only checks image construction and offline CLI imports. It verifies a disposable base/web DB registry on PostgreSQL 17, but not full business logic, production data, all installed modules, or production readiness."
            echo "- It does **not** create/push an image release or deploy anything."
          } >> "$GITHUB_STEP_SUMMARY"
